icp:
  preprocess:
    remove_nan_enable: true
    downsample_enable: true
    outlier_removal_enable: true
    robot_filter_enable: true
    ground_removal_enable: true
    voxel_leaf_size: 0.05               # mapping path (smaller -> denser map)
    registration_voxel_leaf_size: 0.10  # registration only (larger -> faster ICP)
    passthrough_robot_x_min: -0.30
    passthrough_robot_x_max: 0.20
    passthrough_robot_y_min: -0.30
    passthrough_robot_y_max: 0.30
    passthrough_ground_z: 0.10
    mean_k: 20
    stddev_mul_thresh: 1.0
