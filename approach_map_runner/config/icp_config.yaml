node_icp_cuda:
  ros__parameters:
    measure_registration_metrics: false
    frames:
      map: "map"
      odom: "odom"
      base: "base"
      sensor: "livox_lidar"
      camera: "camera_head_link"
    topics:
      input_cloud: "/livox/lidar"
      aligned_cloud: "/approach/aligned_cloud"
      accumulated_cloud: "/approach/accumulated_cloud"
      submap_cloud: "/approach/submap_cloud"
    services:
      accumulation: "accumulate"
    registration:
      backend: "fast_gicp"
      num_threads: 4
      resolution: 0.25                       # VGICP voxel size (used only by fast_vgicp / cuda backends)
      max_correspondence_distance: 1.0
      transformation_epsilon: 1.0e-4
      euclidean_fitness_epsilon: 1.0e-3
      max_iterations: 100
      max_submap_frames: 8
      max_angular_velocity_for_update: 0.35  # rad/s; skip frame if rotating faster
      max_planar_translation_correction: 1.0
      max_yaw_correction: 0.7
      max_roll_correction: 0.15
      max_pitch_correction: 0.15
      max_z_correction: 0.25
    preprocess:
      remove_nan_enable: true
      downsample_enable: true
      outlier_removal_enable: true
      radius_outlier_removal_enable: true
      robot_filter_enable: true
      ground_removal_enable: true
      voxel_leaf_size: 0.05               # mapping path (smaller -> denser map)
      registration_voxel_leaf_size: 0.07  # registration only (larger -> faster ICP)
      passthrough_robot_x_min: -0.30
      passthrough_robot_x_max: 0.60
      passthrough_robot_y_min: -0.6
      passthrough_robot_y_max: 0.6
      passthrough_ground_z: 0.10
      mean_k: 20
      stddev_mul_thresh: 1.0
      radius_search_m: 0.15
      min_neighbors_in_radius: 3
